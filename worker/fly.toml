# KIDS FUN ingestion worker — Fly.io app manifest (approved runtime: Fly.io, Jon 2026-07-13).
# Region `yyz` (Toronto) aligns with the approved ca-central-1 data-residency gate.
# Chromium needs ~1GB. Machine deploy is deferred until M1 ingestion actually needs it
# (cost-conscious: an app with no running machine is $0). Bring-up requires an org-scoped
# Fly token — the current deploy-scoped fly-io token cannot create the app.
app = "kids-fun-worker-staging"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  WORKER_HEALTHZ_PORT = "8080"
  PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "get"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  cpus = 1
