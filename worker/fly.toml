# KIDS FUN ingestion worker — Fly.io app manifest (D-3 default: Fly.io/Railway-class
# container). Region `sea` (Seattle) is closest to Metro Vancouver. Chromium needs ~1GB.
# Swap for a Railway service or satellite-hosted process if the operator prefers.
app = "kids-fun-worker-staging"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  WORKER_HEALTHZ_PORT = "8080"
  PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "get"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  cpus = 1
