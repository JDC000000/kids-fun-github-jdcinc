name: Admin dashboard snapshot refresh

# WHY: app/api/admin/snapshot/refresh/run/route.ts precomputes the /admin/* dashboard
# payloads (operating, product-health, dashboard) into admin_dashboard_snapshot, so those
# pages stop re-deriving 2.9M+ analytics_event rows on every load (migration 0050,
# 2026-09-18 -- see that migration's own header for the measured before/after).
#
# This route is deliberately POST-only, on purpose -- a ~3-minute write job has no business
# reachable by a method the web treats as safe/cacheable/prefetchable (see the route's own
# header). Vercel Cron only issues GET, so it cannot drive this route; a GET alias was tried
# and reverted (see git history on app/api/admin/snapshot/refresh/run/route.ts) specifically
# to keep that guarantee. This workflow is the POST-issuing external scheduler instead --
# same zero-token-cost property as a Vercel Cron would have had (this is a plain HTTP call,
# no LLM session), just POST-capable.
#
# ACTIVATION: set the repo secret ADMIN_SNAPSHOT_CRON_SECRET to the same value configured as
# ADMIN_SNAPSHOT_CRON_SECRET on the Vercel production project (vault slug
# kids-fun-admin-snapshot-cron-secret). Until that secret exists this workflow no-ops with a
# warning, same pattern as migration-drift.yml, so it never sits perpetually red before wiring.
#
# SCHEDULE: once WEEKLY, Monday 14:00 UTC (~7am Pacific, ahead of a typical morning review) --
# revised 2026-09-27 from once daily: Jon asked for fewer runs (5 users, one SMS a week), and
# it cuts GitHub Actions minutes (the repo went past the Free plan's 2,000 min/month). For a
# fresh snapshot between Mondays, use the Actions "Run workflow" button (workflow_dispatch).
# History: daily was itself revised on 2026-09-18 from an initial every-4h guess after real
# measurement showed that guess was itself
# expensive: the refresh costs ~265s of real DB work per run (measured 2026-09-18, see below),
# so 6x/day would cost ~26 min/day of database time regardless of whether anyone ever opens the
# page -- directly against Jon's own "less expensive" framing. This is a review surface, not a
# live dashboard; once a day is enough freshness for it, at 1/6 the cost.
#
# REAL COST, measured 2026-09-18 (not the original 221.9s estimate): total ~265s across all 4
# keys, worst single key (operating:day:30) 136,688ms -- ~24% headroom against the 180s
# per-key ceiling (ADMIN_SNAPSHOT_REFRESH_TIMEOUT_MS), not "weeks". Two reads an hour apart
# showed source_rows barely moved (2,970,600 vs 2,969,684) while compute time varied
# significantly -- this is RUN-TO-RUN VARIANCE UNDER LOAD, not just data growth, and variance
# can breach the ceiling with zero change in data volume. Worth re-measuring after a few real
# scheduled runs rather than trusting this one sample.

on:
  schedule:
    - cron: '0 14 * * 1'       # weekly: Monday 14:00 UTC
  workflow_dispatch: {}

concurrency:
  group: admin-snapshot-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: POST /api/admin/snapshot/refresh/run
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger snapshot refresh
        env:
          SECRET: ${{ secrets.ADMIN_SNAPSHOT_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET:-}" ]; then
            echo "::warning title=Admin snapshot refresh inactive::ADMIN_SNAPSHOT_CRON_SECRET secret is not set -- this workflow is a NO-OP. Provision it from vault slug kids-fun-admin-snapshot-cron-secret to activate."
            exit 0
          fi
          # --max-time 420: measured total refresh time is ~265s (2026-09-18), with one key
          # already varying +61% run-to-run (85.1s -> 136.7s) on essentially no data growth --
          # 300s left only 13% margin, a real near-term timeout risk, not a hypothetical.
          #
          # Exit code captured EXPLICITLY (curl call taken out of `set -e`'s reach via `|| true`)
          # rather than left to `pipefail`, on purpose: the server-side refresh has its own
          # maxDuration=800 and keeps running to completion even if THIS client gives up --
          # so a client-side timeout does not mean the refresh failed, only that the response
          # is unknown. Reporting that as a bare "exit code 28" (or aborting the whole script on
          # it via pipefail before the intended ::error line runs) would false-RED a refresh that
          # actually succeeded, which is exactly how a real signal stops being trusted.
          CURL_EXIT=0
          HTTP_CODE=$(curl -s -o /tmp/refresh_body.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 420 \
            "https://kidsfunapp.ca/api/admin/snapshot/refresh/run") || CURL_EXIT=$?

          if [ "$CURL_EXIT" != "0" ]; then
            echo "::warning title=Admin snapshot refresh: client timed out, server may still finish::curl exit ${CURL_EXIT} (28 = timeout) after 420s. The server-side job runs independently and may still complete successfully -- check computed_at on the next run before assuming this one failed."
            exit 0
          fi

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/refresh_body.json
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error title=Admin snapshot refresh failed::HTTP ${HTTP_CODE} -- see body above."
            exit 1
          fi
